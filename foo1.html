<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alim Hasanov | Career Matrix (Master)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f2; color: #1a1a1a; overflow-x: hidden; }
        .slant-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.01; }
        .slant-line { position: absolute; width: 1px; height: 300%; background: black; transform: rotate(45deg); transform-origin: center; }
        
        /* Padding-right prevents slanted text clipping on the far right */
        .matrix-container { min-width: 1200px; padding-right: 180px; }
        input[type="range"] { accent-color: black; cursor: pointer; }
        
        /* Custom scrollbar for better aesthetics */
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: transparent; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 10px; }
        .overflow-x-auto::-webkit-scrollbar-thumb:hover { background: #a1a1a1; }

        /* Animation for AI summary appearance */
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-ai { animation: fadeInSlide 0.8s ease-out forwards; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
      }
    }
    </script>
</head>
<body class="py-24 px-6 md:px-16 lg:px-24">
    <div class="slant-bg" id="slant-bg"></div>

    <div class="max-w-[1300px] mx-auto relative z-10">
        <header class="mb-20 flex flex-col md:flex-row md:items-end justify-between gap-10">
            <div>
                <span class="text-red-700 text-[10px] font-black uppercase tracking-[0.5em] block mb-2 opacity-80">
                    Senior Application Support & Automation Specialist
                </span>
                <h1 class="text-6xl md:text-[7rem] font-black uppercase tracking-tighter leading-[0.75]">
                    Alim Hasanov
                </h1>
            </div>
            <div class="flex gap-4">
                <button id="toggle-calibration" class="px-6 py-5 border-2 border-black text-[10px] font-black uppercase tracking-[0.2em] transition-all transform hover:-translate-y-1 active:translate-y-0 bg-transparent text-black">
                    Open Calibration
                </button>
                <button id="generate-ai" class="px-8 py-5 bg-red-700 text-white text-[10px] font-black uppercase tracking-[0.2em] hover:bg-black transition-all transform hover:-translate-y-1 active:translate-y-0 shadow-sm">
                    Generate AI Brief
                </button>
            </div>
        </header>

        <!-- AI Summary View -->
        <div id="summary-container" class="hidden mb-20 p-10 bg-white border-l-[8px] border-red-700 shadow-sm animate-ai">
            <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-red-700 mb-4 flex items-center gap-3">
                <span class="w-2 h-2 bg-red-700 rounded-full animate-pulse"></span>
                Strategic Profile Summary
            </h3>
            <p id="summary-text" class="text-gray-800 text-2xl leading-snug font-bold italic"></p>
        </div>

        <!-- Matrix Root -->
        <div class="mb-20 overflow-x-auto relative pb-20">
            <div id="matrix-root" class="matrix-container"></div>
        </div>

        <!-- Calibration Panel (Draggable) -->
        <div id="calibration-panel" class="hidden fixed w-80 bg-white/95 backdrop-blur shadow-2xl border-2 border-black p-6 z-[100] max-h-[80vh] overflow-y-auto select-none">
            <div id="drag-header" class="flex justify-between items-center border-b-2 border-black pb-4 mb-6 cursor-move">
                <h4 class="text-[12px] font-black uppercase tracking-widest">Matrix Calibration</h4>
                <div class="text-[8px] text-gray-300">DRAG TO MOVE</div>
            </div>
            <div id="sliders-container"></div>
            <div class="mt-8 pt-4 border-t border-gray-100 text-[8px] uppercase font-bold text-gray-400 text-center italic">
                Values apply in real-time. Use guides for centering.
            </div>
        </div>

        <!-- Matrix Legend & Footer Info -->
        <footer class="flex flex-wrap items-center gap-10 p-8 border-t border-gray-200 text-gray-400 mt-20">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-[#4CAF50]"></div>
                <span class="text-[10px] font-black uppercase tracking-widest">Daily Focus</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-[#FF9800]"></div>
                <span class="text-[10px] font-black uppercase tracking-widest">Regularly</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-[#005eb8]"></div>
                <span class="text-[10px] font-black uppercase tracking-widest">Support Mode</span>
            </div>
            <div class="ml-auto flex flex-col items-end">
                <span class="text-gray-400 font-black text-[9px] uppercase tracking-[0.2em]">Matrix Calibrator v6.2 (Single-File)</span>
                <span class="text-gray-300 text-[8px] mt-1 font-medium italic tracking-tight">Manual baseline calibration enabled.</span>
            </div>
        </footer>
    </div>

    <!-- Application Logic (Plain JavaScript Module) -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // --- Data Configuration ---
        const CAREER_DATA = {
            employers: [
                { id: "fefund", name: "FE fundinfo", start: "2023-10", end: "2025-05", skills: { "Application Support": 3, "SQL": 3, "Python": 3, "REST APIs": 3, "Jira": 3 }, headerOffset: 15, footerOffset: 15 },
                { id: "elwood", name: "Elwood Tech", start: "2022-05", end: "2023-06", skills: { "Application Support": 3, "Incident Management": 3, "Monitoring": 3, "SQL": 3, "Bash": 3 }, headerOffset: 15, footerOffset: 15 },
                { id: "broadridge", name: "Broadridge", start: "2018-05", end: "2022-05", skills: { "Application Support": 3, "SQL": 3, "Bash": 2, "Troubleshooting": 3 }, headerOffset: 15, footerOffset: 15 },
                { id: "qb", name: "Quant Brokers", start: "2017-02", end: "2018-04", skills: { "Python": 3, "Bash": 3, "Monitoring": 3 }, headerOffset: 15, footerOffset: 15 },
                { id: "tethys", name: "Tethys Tech", start: "2015-08", end: "2017-02", skills: { "Troubleshooting": 3, "Monitoring": 3 }, headerOffset: 15, footerOffset: 15 },
                { id: "bloomberg", name: "Bloomberg", start: "2014-10", end: "2015-06", skills: { "Monitoring": 3, "Master Data Management": 3 }, headerOffset: 15, footerOffset: 15 }
            ],
            skillList: ["Application Support", "Incident Management", "Troubleshooting", "Monitoring", "SQL", "Python", "REST APIs", "Bash", "Jira", "Master Data Management"]
        };

        const COLOR_MAP = { 
            3: 'bg-[#4CAF50]', 
            2: 'bg-[#FF9800]', 
            1: 'bg-[#005eb8]', 
            0: 'bg-transparent' 
        };

        // --- State ---
        let isEditMode = false;
        let isDragging = false;
        let panelPos = { x: 24, y: 100 };
        let dragStart = { x: 0, y: 0 };

        const employers = CAREER_DATA.employers.map(e => {
            const s = new Date(e.start), end = new Date(e.end);
            return { ...e, dur: (end.getFullYear() - s.getFullYear()) * 12 + (end.getMonth() - s.getMonth()) };
        });
        const totalDur = employers.reduce((acc, e) => acc + e.dur, 0);

        const getEl = (id) => document.getElementById(id);

        // --- Rendering ---
        function renderMatrix() {
            const root = getEl('matrix-root');
            if (!root) return;

            let html = '';

            // Header (Timelines)
            html += renderDiagonalHeader(false);

            // Skill Heatmap Rows
            CAREER_DATA.skillList.forEach((skill, idx) => {
                html += `<div class="flex items-stretch h-8 ${idx % 2 === 0 ? 'bg-white/40' : 'bg-transparent'}">
                    <div class="w-[220px] min-w-[220px] px-4 text-[9px] font-black uppercase text-gray-400 flex items-center border-r border-gray-100">${skill}</div>
                    <div class="flex grow h-full">
                        ${employers.map(e => {
                            const level = e.skills[skill] || 0;
                            return `<div class="h-full ${COLOR_MAP[level]} transition-colors duration-200 border-r border-white/20" style="width: ${(e.dur / totalDur) * 100}%"></div>`;
                        }).join('')}
                    </div>
                </div>`;
            });

            // Footer (Employers)
            html += renderDiagonalHeader(true);

            root.innerHTML = html;
        }

        function renderDiagonalHeader(isFooter) {
            let headerHtml = `<div class="relative flex items-stretch overflow-visible h-32">
                <div class="w-[220px] min-w-[220px]"></div>
                <div class="flex grow relative h-full">`;

            employers.forEach((e, idx) => {
                const offset = isFooter ? e.footerOffset : e.headerOffset;
                const text = isFooter ? e.name : `${e.start} — ${e.end}`;
                const width = (e.dur / totalDur) * 100;
                
                headerHtml += `
                    <div class="relative h-full flex group overflow-visible" style="width: ${width}%">
                        <!-- Slanted Cell Boundaries -->
                        <div class="absolute w-[1px] h-[36px] bg-gray-400 z-10" style="right: 0; ${isFooter ? 'top:0' : 'bottom:0'}; transform: rotate(45deg); transform-origin: ${isFooter ? 'top right' : 'bottom right'};"></div>
                        ${idx === 0 ? `<div class="absolute w-[1px] h-[36px] bg-gray-400 z-10" style="left: 0; ${isFooter ? 'top:0' : 'bottom:0'}; transform: rotate(45deg); transform-origin: ${isFooter ? 'top left' : 'bottom left'};"></div>` : ''}
                        
                        <!-- Middle Alignment Guide -->
                        ${isEditMode ? `<div class="absolute w-[1px] h-[36px] bg-red-400/40 z-10" style="left: 50%; ${isFooter ? 'top:0' : 'bottom:0'}; transform: rotate(45deg); transform-origin: ${isFooter ? 'top' : 'bottom'};"></div>` : ''}

                        <!-- Text with Manual Offset Controls -->
                        <div class="absolute w-full z-20 ${isFooter ? 'top-0' : 'bottom-0'} pointer-events-none">
                            <div class="absolute whitespace-nowrap text-[10px] font-black uppercase text-gray-500 group-hover:text-red-700 transition-colors pointer-events-auto"
                                 style="${isFooter ? 'top: 6px; right:' : 'bottom: 6px; left:'} calc(50% + ${offset}px); transform: rotate(-45deg); transform-origin: ${isFooter ? 'top right' : 'bottom left'};">
                                ${text}
                            </div>
                        </div>
                    </div>`;
            });

            headerHtml += `</div></div>`;
            return headerHtml;
        }

        function renderSliders() {
            const container = getEl('sliders-container');
            if (!container) return;

            container.innerHTML = employers.map(e => `
                <div class="mb-8 last:mb-0">
                    <div class="text-[10px] font-black uppercase text-red-700 mb-3">${e.name}</div>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-[8px] font-bold uppercase text-gray-400 mb-1">
                                <span>Header Offset</span>
                                <span>${e.headerOffset}PX</span>
                            </div>
                            <input type="range" min="-50" max="50" value="${e.headerOffset}" data-id="${e.id}" data-type="headerOffset" class="w-full h-1 bg-gray-200 rounded-lg appearance-none">
                        </div>
                        <div>
                            <div class="flex justify-between text-[8px] font-bold uppercase text-gray-400 mb-1">
                                <span>Footer Offset</span>
                                <span>${e.footerOffset}PX</span>
                            </div>
                            <input type="range" min="-50" max="50" value="${e.footerOffset}" data-id="${e.id}" data-type="footerOffset" class="w-full h-1 bg-gray-200 rounded-lg appearance-none">
                        </div>
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', (event) => {
                    const target = event.target;
                    const id = target.dataset.id;
                    const type = target.dataset.type;
                    const emp = employers.find(item => item.id === id);
                    if (emp) {
                        emp[type] = parseInt(target.value);
                        target.previousElementSibling.lastElementChild.textContent = `${target.value}PX`;
                        renderMatrix();
                    }
                });
            });
        }

        // --- Event Listeners ---
        getEl('toggle-calibration').addEventListener('click', () => {
            isEditMode = !isEditMode;
            const btn = getEl('toggle-calibration');
            const panel = getEl('calibration-panel');
            
            if (isEditMode) {
                btn.textContent = 'Close Calibration';
                btn.classList.add('bg-black', 'text-white');
                panel.classList.remove('hidden');
                renderSliders();
            } else {
                btn.textContent = 'Open Calibration';
                btn.classList.remove('bg-black', 'text-white');
                panel.classList.add('hidden');
            }
            renderMatrix();
        });

        getEl('generate-ai').addEventListener('click', async () => {
            const btn = getEl('generate-ai');
            btn.disabled = true;
            btn.textContent = 'Synthesizing...';

            const ai = new GoogleGenAI({ apiKey: process.env.API_KEY || '' });
            const prompt = `Generate a high-impact professional summary for Alim Hasanov, based on his experience at FE fundinfo, Elwood, and Broadridge. Focus on SQL, Python, App Support, and Automation. Keep it to 100-120 words. No markdown formatting, just the text.`;

            try {
                const response = await ai.models.generateContent({ 
                    model: 'gemini-3-flash-preview', 
                    contents: prompt 
                });
                getEl('summary-container').classList.remove('hidden');
                getEl('summary-text').textContent = response.text;
            } catch (err) {
                console.error("AI Generation failed:", err);
                getEl('summary-container').classList.remove('hidden');
                getEl('summary-text').textContent = "Error generating summary. Please check your API connectivity.";
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate AI Brief';
            }
        });

        // --- Draggability ---
        const dragHeader = getEl('drag-header');
        const calibrationPanel = getEl('calibration-panel');

        dragHeader.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart = {
                x: e.clientX - (window.innerWidth - panelPos.x - 320),
                y: e.clientY - panelPos.y
            };
            calibrationPanel.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const newY = e.clientY - dragStart.y;
            const newXFromRight = window.innerWidth - e.clientX + dragStart.x - 320;
            panelPos = { x: Math.max(0, newXFromRight), y: Math.max(0, newY) };
            calibrationPanel.style.right = `${panelPos.x}px`;
            calibrationPanel.style.top = `${panelPos.y}px`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            calibrationPanel.style.transition = '';
        });

        // --- Initialization ---
        function initBg() {
            const bg = getEl('slant-bg');
            if (!bg) return;
            for (let i = 0; i < 30; i++) {
                const line = document.createElement('div');
                line.className = 'slant-line';
                line.style.left = `${i * 5}%`;
                line.style.top = '-100%';
                bg.appendChild(line);
            }
        }

        initBg();
        renderMatrix();
    </script>
</body>
</html>
